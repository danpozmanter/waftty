[project]
id = "dev.gossamer/waftty"
version = "0.5.13"
gossamer-version = "^v0.78.1"
# A GUI application: Windows opens no console window beside it.
windows-subsystem = "windows"
authors = ["Dan Pozmanter"]
license = "Apache 2.0"

# The engine's optional parts (rich text import, SVG, JPEG and GIF) stay out:
# a terminal draws none of them.
[dependencies]
"github.com/gossamer-lang/gui-gos" = { path = "../goose-libs/gui-gos", default-features = false }
"github.com/gossamer-lang/gui-engine-gos" = { path = "../goose-libs/gui-engine-gos", default-features = false }
"github.com/gossamer-lang/windowing-gos" = { path = "../goose-libs/windowing-gos" }
