name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOSSAMER_REPO: gossamer-lang/gossamer
  # The toolchain release waftty builds with. Its runtime targets glibc 2.39
  # (Ubuntu 24.04), the floor of the Linux packages, and its macos12 archives
  # target macOS 12, the floor of the macOS packages.
  GOSSAMER_VERSION: v0.78.7
  # project.toml reaches the libraries at ../goose-libs/<name>. CI checks out
  # these releases; a waftty release changes them with its "Builds on" line,
  # and test.yml and release.yml name the same ones.
  WINDOWING_REF: v0.1.20
  ENGINE_REF: v0.2.17
  GUI_REF: v0.2.6
  RUSTUP_TOOLCHAIN: 1.95.0
  APPIMAGETOOL_VERSION: "1.9.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # On macOS cargo's built-in git speaks TLS through SecureTransport, whose
      # connections to skia.googlesource.com (a submodule of sdl3-sys's
      # SDL_image) drop; the git client fetches over its own TLS stack.
      CARGO_NET_GIT_FETCH_WITH_CLI: ${{ startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            arch: x86_64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            arch: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: waftty
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/windowing-gos
          ref: ${{ env.WINDOWING_REF }}
          path: goose-libs/windowing-gos
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/gui-engine-gos
          ref: ${{ env.ENGINE_REF }}
          path: goose-libs/gui-engine-gos
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/gui-gos
          ref: ${{ env.GUI_REF }}
          path: goose-libs/gui-gos

      - name: Read the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' waftty/project.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag names the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match project.toml version $VERSION" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Install SDL's build dependencies, LLVM and the Gossamer toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config llvm-18 desktop-file-utils \
            dpkg-dev rpm \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libdecor-0-dev
          curl -fsSL "https://raw.githubusercontent.com/${GOSSAMER_REPO}/main/scripts/install.sh" | sh
          curl -fsSL --retry 20 --retry-delay 30 -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool"
          # appimagetool's own download of the runtime cannot retry.
          curl -fsSL --retry 20 --retry-delay 30 -o "$HOME/.local/bin/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64"
          echo "APPIMAGE_RUNTIME=$HOME/.local/bin/appimage-runtime" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # macOS packages run on macOS 12 and later, as lite-anvil's do. Every
      # compiler and linker in the build reads the oldest macOS from here.
      - name: Target macOS 12 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          # C built for an older macOS than the SDK checks the running version
          # through ___isPlatformVersionAtLeast, in libclang_rt.osx.a, which
          # rustc links without (-nodefaultlibs); UTType is in its own framework.
          case "${{ matrix.arch }}" in aarch64) clang_arch=arm64 ;; *) clang_arch=x86_64 ;; esac
          clang_rt="$(clang -arch "$clang_arch" -print-file-name=libclang_rt.osx.a)"
          echo "RUSTFLAGS=-C link-arg=$clang_rt -C link-arg=-framework -C link-arg=UniformTypeIdentifiers" >> "$GITHUB_ENV"
      - name: Install the Gossamer toolchain, LLVM and Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          # The macos12 archive's toolchain and runtime target macOS 12.
          gh release download "$GOSSAMER_VERSION" --repo "$GOSSAMER_REPO" \
            --pattern "gos-*-macos12-${{ matrix.arch }}.zip" --dir gos-dist
          ditto -x -k gos-dist/*.zip gos-dist
          sh gos-dist/gos-*/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          brew install llvm@22 ninja
          prefix="$(brew --prefix llvm@22)"
          echo "GOS_LLVM_OPT=$prefix/bin/opt" >> "$GITHUB_ENV"
          echo "GOS_LLC=$prefix/bin/llc" >> "$GITHUB_ENV"
      - name: Install the Gossamer toolchain and LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:GOSSAMER_VERSION --repo $env:GOSSAMER_REPO --pattern 'gos-*-windows-x86_64.zip' --dir gos-dist
          Expand-Archive -Path (Get-ChildItem gos-dist\*.zip).FullName -DestinationPath gos-dist\gos
          $bin = (Get-ChildItem gos-dist\gos -Recurse -Filter gos.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-gcc
          if ($LASTEXITCODE -ne 0) { throw "pacman failed (exit $LASTEXITCODE)" }
          Add-Content $env:GITHUB_ENV "GOS_LLVM_OPT=C:\msys64\mingw64\bin\opt.exe"
          Add-Content $env:GITHUB_ENV "GOS_LLC=C:\msys64\mingw64\bin\llc.exe"
      - run: gos --version

      - name: Fetch the dependencies
        run: |
          sh goose-libs/gui-gos/tools/fetch.sh
          (cd waftty && gos fetch)

      - name: Build and package
        run: bash waftty/scripts/package.sh --installers dist 2>&1 | tee package.log
      - name: List the package
        run: ls -la dist

      # The zip as a user gets it, installed by its install.command and run.
      - name: Install with install.command and run the app (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/waftty-*-macos-*.zip try
          bash try/install.command
          /Applications/waftty.app/Contents/MacOS/waftty --version
      # Nothing in the package may ask for a macOS newer than 12: the binary's
      # build record, Info.plist, and no object the link took from a newer one.
      - name: Check the app opens on macOS 12 (macOS)
        if: runner.os == 'macOS'
        run: |
          app=/Applications/waftty.app/Contents
          vtool -show-build "$app/MacOS/waftty"
          vtool -show-build "$app/MacOS/waftty" | grep -Eq 'minos 12\.0$'
          [ "$(plutil -extract LSMinimumSystemVersion raw "$app/Info.plist")" = 12.0 ]
          if grep -i 'built for newer' package.log; then exit 1; fi

      # Each Linux package as a user gets it, installed and run: the .deb here,
      # the .rpm on Fedora, and the AppImage as downloaded.
      - name: Install the .deb, .rpm and AppImage and run the app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/waftty_*.deb
          /usr/bin/waftty --version
          sudo apt-get remove -y waftty
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 \
            sh -c 'dnf -y -q install /dist/waftty-*.rpm && waftty --version'
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/waftty-*.AppImage --version

      # The installer as a user runs it: installed for the current user with
      # waftty on the PATH, run, uninstalled, and then extracted portably.
      - name: Install with the setup program and run the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # waftty.exe is a windowed program, which the shell starts without
          # waiting for, so each run waits on the process for its exit code.
          function Assert-Version($exe) {
            $out = "$env:RUNNER_TEMP\waftty-version.txt"
            $run = Start-Process $exe -Wait -PassThru -NoNewWindow -ArgumentList '--version' -RedirectStandardOutput $out
            if ($run.ExitCode -ne 0) { throw "$exe exited with $($run.ExitCode)" }
            $printed = (Get-Content $out -Raw).Trim()
            if ($printed -ne "waftty $env:VERSION") { throw "$exe printed '$printed'" }
            Write-Output $printed
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zip in Get-ChildItem dist\*.zip) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            $named = @($archive.Entries | Where-Object { $_.FullName.Contains('\') })
            $archive.Dispose()
            if ($named.Count -gt 0) { throw "$($zip.Name) names entries with backslashes" }
          }
          $setup = (Get-ChildItem dist\waftty-*-setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\waftty-installed"
          $run = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=envpath', "/DIR=$dir"
          if ($run.ExitCode -ne 0) { throw "setup exited with $($run.ExitCode)" }
          Assert-Version "$dir\waftty.exe"
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $dir)) { throw "setup did not put $dir on the PATH" }
          # The uninstaller hands its work to a copy of itself in TEMP (_iu*.tmp) and exits.
          $run = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if ($run.ExitCode -ne 0) { throw "the uninstaller exited with $($run.ExitCode)" }
          Get-Process -Name '_iu*' -ErrorAction SilentlyContinue | Wait-Process
          if (Test-Path "$dir\waftty.exe") { throw "the uninstaller left waftty.exe" }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $dir) { throw "the uninstaller left $dir on the PATH" }
          $portable = "$env:RUNNER_TEMP\waftty-portable"
          $run = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=portablemode', "/DIR=$portable"
          if ($run.ExitCode -ne 0) { throw "the portable setup exited with $($run.ExitCode)" }
          if (-not (Test-Path "$portable\user" -PathType Container)) { throw "the portable extraction has no user folder" }
          if (Test-Path "$portable\unins000.exe") { throw "the portable extraction has an uninstaller" }
          Assert-Version "$portable\waftty.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: waftty-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  # FreeBSD has no hosted runner, so the package builds in a FreeBSD VM. The
  # Gossamer release for FreeBSD is built on FreeBSD 15, the package's floor.
  build-freebsd:
    name: FreeBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          path: waftty
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/windowing-gos
          ref: ${{ env.WINDOWING_REF }}
          path: goose-libs/windowing-gos
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/gui-engine-gos
          ref: ${{ env.ENGINE_REF }}
          path: goose-libs/gui-engine-gos
      - uses: actions/checkout@v6
        with:
          repository: gossamer-lang/gui-gos
          ref: ${{ env.GUI_REF }}
          path: goose-libs/gui-gos

      - name: Read the version
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' waftty/project.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag names the project's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match project.toml version $VERSION" >&2
            exit 1
          fi

      # The tarball as a user gets it, unpacked, installed and run.
      - name: Build, package, install and run in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          usesh: true
          mem: 12288
          envs: GOSSAMER_REPO GOSSAMER_VERSION RUSTUP_TOOLCHAIN VERSION
          prepare: |
            pkg install -y bash curl git cmake ninja pkgconf python3 llvm22 \
              libX11 libXext libXrandr libXcursor libXi libXfixes libXScrnSaver libXtst \
              libxkbcommon wayland wayland-protocols libdecor mesa-libs
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
            curl -fsSL "https://raw.githubusercontent.com/${GOSSAMER_REPO}/main/scripts/install.sh" | sh
          run: |
            set -e
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            gos --version
            sh goose-libs/gui-gos/tools/fetch.sh
            (cd waftty && gos fetch)
            bash waftty/scripts/package.sh dist
            ls -la dist
            mkdir try
            tar -xzf dist/waftty-*-freebsd-x86_64.tar.gz -C try
            PREFIX="$PWD/installed" sh try/waftty-*/install.sh
            [ "$(installed/bin/waftty --version)" = "waftty $VERSION" ]
      - uses: actions/upload-artifact@v4
        with:
          name: waftty-freebsd-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## " v " - ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no ## $version section"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: waftty-*
          path: artifacts/
      - name: Collect release files
        run: |
          find artifacts -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.exe' -o -name '*.sha256' \) \
            -exec mv {} artifacts/ \;
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.sha256
